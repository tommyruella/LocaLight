<!DOCTYPE html>
<html>
<head><title>M6 ASC CDL Test</title></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { LocalLightEngine } from './engine.js';

window.runTest = async function() {
    let results = [];
    function log(name, pass, data={}) {
        results.push({ test: name, pass: pass, ...data });
    }

    const W = 256;
    const H = 256;
    const canvas = document.getElementById('c');
    canvas.width = W;
    canvas.height = H;
    const gl = canvas.getContext('webgl2', {preserveDrawingBuffer: true});
    const engine = new LocalLightEngine(canvas, gl);
    
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = W; srcCanvas.height = H;
    const ctx = srcCanvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, 'black');
    grad.addColorStop(1, 'white');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H/2);
    ctx.fillStyle = 'rgb(128,128,128)';
    ctx.fillRect(0, H/2, W, H/2);
    engine.loadImage(srcCanvas);
    
    function renderAndRead(stateUpdates) {
        Object.assign(engine.state, { u_lift: [0,0,0], u_gamma: [1,1,1], u_gain: [1,1,1], u_saturation: 0, u_vibrance: 0 });
        Object.assign(engine.state, stateUpdates);
        engine.render([]);
        const outPixels = new Uint8Array(W * H * 4);
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, outPixels);
        return outPixels;
    }
    
    const base = renderAndRead({});
    const bypass = renderAndRead({ u_lift: [0,0,0], u_gamma: [1,1,1], u_gain: [1,1,1] });
    let maxDiffBypass = 0;
    for (let i = 0; i < base.length; i++) {
        maxDiffBypass = Math.max(maxDiffBypass, Math.abs(base[i] - bypass[i]));
    }
    log("1. ASC CDL BYPASS", maxDiffBypass === 0, { maxDiff: maxDiffBypass });
    
    const gainTest = renderAndRead({ u_gain: [1.5, 0.5, 1.0] });
    const idxGray = (10 * W + 128) * 4; 
    const rGain = gainTest[idxGray];
    const gGain = gainTest[idxGray+1];
    const bGain = gainTest[idxGray+2];
    log("2. GAIN direction", rGain > base[idxGray] && gGain < base[idxGray+1] && Math.abs(bGain - base[idxGray+2]) <= 1, 
        { rGain, gGain, bGain, rBase: base[idxGray] });
    
    const gammaTest = renderAndRead({ u_gamma: [2.0, 0.5, 1.0] });
    const rGamma = gammaTest[idxGray];
    const gGamma = gammaTest[idxGray+1];
    log("3. GAMMA direction and No NaN", rGamma !== 0 && gGamma !== 0 && !isNaN(rGamma) && rGamma > base[idxGray] && gGamma < base[idxGray+1], 
        { rGamma, gGamma, rBase: base[idxGray] });
    
    const liftTest = renderAndRead({ u_lift: [0.1, -0.1, 0.0] });
    const idxBlack = (200 * W + 10) * 4; 
    const idxWhite = (200 * W + (W - 10)) * 4;
    const rLiftBlack = liftTest[idxBlack];
    const rLiftWhite = liftTest[idxWhite];
    const deltaBlack = rLiftBlack - base[idxBlack];
    const deltaWhite = rLiftWhite - base[idxWhite];
    log("4. LIFT translation and highlight protection", deltaBlack > 0 && deltaWhite < deltaBlack && deltaWhite >= 0, 
        { deltaBlack, deltaWhite });
        
    return results;
}
</script>
</body>
</html>
