<!DOCTYPE html>
<html>
<head><title>M9 Runtime Test</title></head>
<body>
<canvas id="canvas" width="1" height="1"></canvas>
<script type="module">
import { LocalLightEngine } from './engine.js';

window.runTest = async function() {
    const canvas = document.getElementById('canvas');
    const engine = new LocalLightEngine(canvas);
    
    const gl = engine.gl;
    if (!gl) return "FAIL: No WebGL2";
    
    const prog = engine.baseProgram;
    gl.useProgram(prog);
    
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    
    const outTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, outTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);
    
    gl.uniform1f(engine.baseLocs['u_exposure'], 0.0);
    gl.uniform3fv(engine.baseLocs['u_wb_scale'], [1,1,1]);
    gl.uniform1i(engine.baseLocs['u_is_srgb_input'], 0);
    gl.uniform1fv(engine.baseLocs['u_spline_x'], [-12, -6, 0, 6, 12]);
    gl.uniform1fv(engine.baseLocs['u_spline_y'], [-12, -6, 0, 6, 12]);
    gl.uniform1fv(engine.baseLocs['u_spline_m'], [1, 1, 1, 1, 1]);
    gl.uniform1f(engine.baseLocs['u_saturation'], 0.0);
    gl.uniform1f(engine.baseLocs['u_vibrance'], 0.0);
    gl.uniform3fv(engine.baseLocs['u_lift'], [0,0,0]);
    gl.uniform3fv(engine.baseLocs['u_gamma'], [1,1,1]);
    gl.uniform3fv(engine.baseLocs['u_gain'], [1,1,1]);
    
    const shifts = new Float32Array(24);
    
    function testPixel(r, g, b, shiftsArray) {
        gl.uniform1fv(engine.baseLocs['u_hsl_shifts'], shiftsArray);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1, 1, 0, gl.RGBA, gl.FLOAT, new Float32Array([r, g, b, 1.0]));
        engine.bindQuad(prog);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        
        const pixels = new Uint8Array(4);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        return [pixels[0]/255.0, pixels[1]/255.0, pixels[2]/255.0];
    }
    
    let results = [];
    
    // 1. Midpoint (15 deg) - Red Shift +0.5
    shifts.fill(0);
    shifts[0] = 0.5;
    let resMidRed = testPixel(1.0, 0.25, 0.0, shifts);
    results.push({ test: 'Midpoint 15deg (Red +0.5)', actual: resMidRed, expected: [1.0, 0.4375, 0.0] });

    // 2. Midpoint (15 deg) - Orange Shift +0.5
    shifts.fill(0);
    shifts[3] = 0.5; // Orange H is at index 3
    let resMidOrange = testPixel(1.0, 0.25, 0.0, shifts);
    results.push({ test: 'Midpoint 15deg (Orange +0.5)', actual: resMidOrange, expected: [1.0, 0.4375, 0.0] });
    
    // 3. Wrap-around 350deg - Red Shift +1.0
    // 350 deg RGB: [1.0, 0.0, 10/60] = [1.0, 0.0, 0.1666]
    shifts.fill(0);
    shifts[0] = 1.0;
    let resWrapRed = testPixel(1.0, 0.0, 10.0/60.0, shifts);
    results.push({ test: 'Wrap 350deg (Red +1.0)', actual: resWrapRed, expected: [1.0, 0.5277, 0.0] });

    // 4. Wrap-around 350deg - Magenta Shift +1.0
    shifts.fill(0);
    shifts[21] = 1.0; // Magenta H is at index 21
    let resWrapMag = testPixel(1.0, 0.0, 10.0/60.0, shifts);
    results.push({ test: 'Wrap 350deg (Magenta +1.0)', actual: resWrapMag, expected: [1.0, 0.0, 0.1111] });
    
    // 5. Saturation/Lightness clamp
    shifts.fill(0);
    shifts[1] = 1.0; // Red Sat +1.0
    let resSat = testPixel(0.6, 0.4, 0.4, shifts);
    results.push({ test: 'Desaturated (Red Sat +1.0)', actual: resSat, expected: [1.0, 0.0, 0.0] });

    shifts.fill(0);
    shifts[2] = 1.0; // Red Lum +1.0
    let resLum = testPixel(0.6, 0.4, 0.4, shifts);
    results.push({ test: 'Desaturated (Red Lum +1.0)', actual: resLum, expected: [1.0, 1.0, 1.0] });

    return JSON.stringify(results);
}
</script>
</body>
</html>
