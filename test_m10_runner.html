<!DOCTYPE html>
<html>
<head><title>M10 Formal Audit Test</title></head>
<body>
<canvas id="canvas" width="64" height="64"></canvas>
<script type="module">
import { LocalLightEngine } from './engine.js';

window.runTest = async function() {
    const canvas = document.getElementById('canvas');
    const engine = new LocalLightEngine(canvas);
    const gl = engine.gl;
    if (!gl) return JSON.stringify([{test: "WebGL", pass: false}]);
    
    // Clear any previous GL errors
    while(gl.getError() !== gl.NO_ERROR) {}
    
    let results = [];
    let log = (msg, pass, extra={}) => results.push({ test: msg, pass: pass, ...extra });

    function renderAndRead(stateUpdates) {
        Object.assign(engine.state, {
            u_sharpness: 0, u_clarity: 0, u_halation: 0, u_grain: 0, u_noise: 0, u_glow: 0
        });
        Object.assign(engine.state, stateUpdates);
        engine.render([]);
        const pixels = new Uint8Array(64 * 64 * 4);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        return pixels;
    }
    
    function isIdentical(a, b) {
        for(let i=0; i<a.length; i++) if(a[i] !== b[i]) return false;
        return true;
    }
    
    function calcVariance(pixels) {
        let mean = 0, meanSq = 0;
        let count = pixels.length / 4;
        for(let i=0; i<pixels.length; i+=4) {
            let luma = (pixels[i] + pixels[i+1] + pixels[i+2])/3.0;
            mean += luma;
            meanSq += luma*luma;
        }
        mean /= count;
        meanSq /= count;
        return meanSq - (mean*mean);
    }

    // --- SCENE 1: Mid-gray background with solid dark square (for bypass and grain tests) ---
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = 64; srcCanvas.height = 64;
    const ctx = srcCanvas.getContext('2d');
    
    ctx.fillStyle = 'rgb(128,128,128)';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = 'rgb(32,32,32)';
    ctx.fillRect(16, 16, 32, 32);
    engine.loadImage(srcCanvas);
    
    let base1 = renderAndRead({});
    
    // 1. Bypass Invariance
    let bypassSharp = renderAndRead({u_sharpness: 0});
    let bypassClarity = renderAndRead({u_clarity: 0});
    let bypassHalation = renderAndRead({u_halation: 0});
    let bypassGrain = renderAndRead({u_grain: 0});
    let bypassNoise = renderAndRead({u_noise: 0});
    
    log("1. Bypass invariance (effect=0 is byte-identical to baseline)", 
        isIdentical(base1, bypassSharp) && isIdentical(base1, bypassClarity) && 
        isIdentical(base1, bypassHalation) && isIdentical(base1, bypassGrain) && 
        isIdentical(base1, bypassNoise));

    // 2 & 3. Grain vs Noise
    let grain1 = renderAndRead({u_grain: 1.0});
    let grain2 = renderAndRead({u_grain: 1.0});
    let noise1 = renderAndRead({u_noise: 1.0});
    
    let varBase = calcVariance(base1);
    let varGrain = calcVariance(grain1);
    let varNoise = calcVariance(noise1);
    
    log("2. Grain adds measurable, deterministic variance", varGrain > varBase + 5 && isIdentical(grain1, grain2));
    log("3. Noise adds variance separate from Grain", varNoise > varBase + 5 && !isIdentical(grain1, noise1));

    // --- SCENE 2: Clarity vs Sharpness (Frequency response) ---
    // Left half gray, right half white.
    ctx.fillStyle = 'rgb(128,128,128)';
    ctx.fillRect(0, 0, 32, 64);
    ctx.fillStyle = 'rgb(255,255,255)';
    ctx.fillRect(32, 0, 32, 64); 
    engine.loadImage(srcCanvas);
    
    let base2 = renderAndRead({});
    let sharp1 = renderAndRead({u_sharpness: 1.0});
    let clar1 = renderAndRead({u_clarity: 1.0});
    
    // Edge is at X=32. Pixel X=31 is gray.
    let dist1Idx = (32 * 64 + 31) * 4;
    let dist3Idx = (32 * 64 + 29) * 4;
    
    let sharpDist1 = Math.abs(sharp1[dist1Idx] - base2[dist1Idx]); 
    let sharpDist3 = Math.abs(sharp1[dist3Idx] - base2[dist3Idx]); 
    
    let clarDist1 = Math.abs(clar1[dist1Idx] - base2[dist1Idx]);
    let clarDist3 = Math.abs(clar1[dist3Idx] - base2[dist3Idx]);
    
    log("4. Sharpness modifies immediate edge, unchanged away from edge", sharpDist1 > 0 && sharpDist3 === 0, {d1: sharpDist1, d3: sharpDist3});
    log("5. Clarity operates at lower frequency than Sharpness", clarDist3 > sharpDist3 && clarDist3 > 0, {clarD3: clarDist3, sharpD3: sharpDist3});

    // --- SCENE 3: Halation (White background, small black hole) ---
    ctx.fillStyle = 'rgb(255,255,255)';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = 'rgb(0,0,0)';
    ctx.fillRect(31, 31, 2, 2);
    engine.loadImage(srcCanvas);
    
    let base3 = renderAndRead({});
    let halHalf = renderAndRead({u_halation: 0.5});
    let halFull = renderAndRead({u_halation: 1.0});
    let glow1 = renderAndRead({u_glow: 1.0});
    
    let holeIdx = (31 * 64 + 31) * 4;
    log("6. Halation highlight spills into hole", halFull[holeIdx] > base3[holeIdx]);
    log("8. Halation intensity is monotonically increasing", halFull[holeIdx] > halHalf[holeIdx] && halHalf[holeIdx] > base3[holeIdx]);
    log("9. Blur spreads energy continuously into hole", glow1[holeIdx] > base3[holeIdx]);

    // --- SCENE 4: Halation under threshold ---
    ctx.fillStyle = 'rgb(64,64,64)'; // well under 0.6
    ctx.fillRect(0, 0, 64, 64);
    engine.loadImage(srcCanvas);
    
    let darkBase = renderAndRead({});
    let darkHal = renderAndRead({u_halation: 1.0});
    log("7. Halation under threshold produces no spill", isIdentical(darkBase, darkHal));

    // 10. GL Errors
    let postErr = gl.getError();
    log("10. No gl.getError() after all rendering", postErr === gl.NO_ERROR);
    
    // 11. Uniforms Connected
    let allLocs = ['u_sharpness', 'u_clarity', 'u_halation', 'u_grain', 'u_noise', 'u_glow']
        .every(n => engine.compLocs[n] !== null && engine.compLocs[n] !== undefined);
    log("11. All M10 uniforms statically present", allLocs);

    return JSON.stringify(results, null, 2);
}
</script>
</body>
</html>
